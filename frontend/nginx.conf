server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sem isto, o nginx resolve "api" UMA VEZ na largada e guarda o IP para
    # sempre — quando o container da API é recriado (deploy, crash, restart),
    # o IP muda e o nginx continua batendo no IP velho: 502 Bad Gateway.
    # A variável em proxy_pass força reavaliação a cada requisição, respeitando
    # o TTL abaixo (é a mesma razão pela qual um Service do Kubernetes existe).
    # __DNS_RESOLVER__ é substituído em runtime por docker-entrypoint-resolver.sh
    # — o endereço do DNS embutido muda entre Podman e Docker (ver o script).
    resolver __DNS_RESOLVER__ valid=10s;

    location /api/ {
        # "set" TEM que vir antes do "rewrite ... break": break interrompe o
        # resto das diretivas do módulo rewrite (que inclui o próprio "set")
        # para esta location — invertida, a variável nunca é inicializada.
        set $upstream_api http://api:8080;
        # proxy_pass SEM URI estática (obrigatório quando o destino é uma
        # variável, para o resolver acima funcionar) deixa de cortar o "/api/"
        # sozinho — o rewrite abaixo faz esse corte à mão antes de proxiar.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
