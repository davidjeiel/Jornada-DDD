; ============================================================================
;  PgBouncer local — reproduz o transaction pooling do Azure Database for
;  PostgreSQL Flexible Server (ADR-0003).
;
;  ISTO NÃO É OPCIONAL NO AMBIENTE LOCAL. Em session pooling (ou sem pooler)
;  uma conexão pertence a uma requisição do começo ao fim, e um bug de contexto
;  de tenant NUNCA aparece. É só em transaction pooling que a conexão volta ao
;  pool entre transações e pode ser entregue à requisição de OUTRA empresa —
;  que é exatamente o cenário que o `set_config(..., true)` precisa sobreviver.
; ============================================================================

[databases]
; A aplicação conecta em localhost:6432/catalogo e o PgBouncer repassa.
catalogo = host=postgres port=5432 dbname=catalogo

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ── O ajuste que importa ────────────────────────────────────────────────────
pool_mode = transaction

; server_reset_query fica VAZIO de propósito. Em transaction pooling o PgBouncer
; não roda DISCARD ALL entre transações, então nada "limpa" um SET esquecido.
; Deixar vazio torna o ambiente local MAIS RIGOROSO que o descuidado: se o
; código usar SET de sessão em vez de set_config(..., true), o vazamento entre
; empresas aparece aqui, na sua máquina, e não na do cliente.
server_reset_query =
server_reset_query_always = 0

; ── Npgsql ──────────────────────────────────────────────────────────────────
; O driver .NET manda estes parâmetros no startup e o PgBouncer recusa a
; conexão se não souber ignorá-los. Sintoma sem isto:
;   "unsupported startup parameter: extra_float_digits"
ignore_startup_parameters = extra_float_digits,options,search_path

; ── Dimensionamento de desenvolvimento ──────────────────────────────────────
max_client_conn = 200
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3

; ── Operação ────────────────────────────────────────────────────────────────
admin_users = catalogo_migrador
stats_users = catalogo_migrador, catalogo_app

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

server_lifetime = 600
server_idle_timeout = 60
query_wait_timeout = 15

; Para inspecionar o pool durante um teste:
;   psql "postgresql://catalogo_migrador@localhost:6432/pgbouncer" -c "SHOW POOLS;"
