# Ambiente local do Catálogo Corporativo DDD — Podman (ADR-0013)
#
#   podman compose up -d          sobe tudo
#   podman compose --profile busca up -d   inclui o OpenSearch opcional
#   podman compose down -v        derruba e apaga volumes
#
# Este arquivo também roda em Docker sem alteração (o CI usa Docker).
# Regra: imagens SEMPRE com registro explícito — Podman não assume docker.io.

name: catalogo-local

x-saude: &saude
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:

  # ───────────────────────────────────── Cosmos DB, API NoSQL (ADR-0016)
  # O sistema de registro. Emulador Linux (vNext): mesma API da conta real,
  # sem RU nem índices de verdade — custo e desempenho só se medem no Azure.
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    container_name: catalogo-cosmos
    environment:
      # O SDK .NET não fala HTTP com o emulador: tem de ser HTTPS (certificado
      # autoassinado, aceito pela API só com Cosmos__Emulador=true).
      PROTOCOL: https
      ENABLE_TELEMETRY: "false"
    ports:
      - "8081:8081"     # endpoint do Cosmos
      - "1234:1234"     # Data Explorer
    volumes:
      - cosmosdados:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      <<: *saude

  # ─────────────────────────────────────────────── Cache / rate limit (ADR-0004)
  valkey:
    image: docker.io/valkey/valkey:8-alpine
    container_name: catalogo-valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      <<: *saude

  # ──────────────────────────────────────────── Blob Storage (evidências, exports)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: catalogo-azurite
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--location", "/dados"]
    ports:
      - "10000:10000"   # blob
      - "10001:10001"   # queue
      - "10002:10002"   # table
    volumes:
      - azuritedados:/dados

  # ───────────────────────────────────────── Service Bus — outbox real (ADR-0008)
  # ATENÇÃO: o instalador oficial da Microsoft ainda referencia azure-sql-edge,
  # que foi APOSENTADO em 30/09/2025. Usamos mssql/server:2022.
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: catalogo-servicebus
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dev_Local_Senha_Forte_1}
      ACCEPT_EULA: "Y"
    volumes:
      - ./servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro,Z
    ports:
      - "5672:5672"     # AMQP
      - "5300:5300"     # gestão + /health

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: catalogo-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dev_Local_Senha_Forte_1}
      MSSQL_PID: Developer
    healthcheck:
      # sqlcmd mudou de caminho no 2022; tentamos os dois
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  # ───────────────────────────── Identidade — OIDC local no lugar do Entra (ADR-0007)
  # NÃO é Entra External ID. É OIDC padrão, que é o que a porta IProvedorDeIdentidade
  # consome. Federação com IdP de cliente só se testa em homologação.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: catalogo-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro,Z
    ports:
      - "8080:8080"

  # ───────────────────── Observabilidade — OTLP local no lugar do Azure Monitor
  # Mesmo protocolo (OpenTelemetry) que produção; muda só o destino.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: catalogo-otel
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"   # painel web
      - "18889:18889"   # OTLP/gRPC — é para cá que a aplicação exporta

  # ─────────────────────── Busca — OPCIONAL, só quando mexer no adaptador de busca
  # A busca do catálogo ainda roda sobre consultas do próprio Cosmos (ADR-0016);
  # este serviço só sobe quando alguém estiver mexendo num adaptador de busca.
  opensearch:
    profiles: ["busca"]
    image: docker.io/opensearchproject/opensearch:2
    container_name: catalogo-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  # ─────────────────────────────── Perfil "full" — a APLICAÇÃO em container
  # Grupo 1 (containers/pods): a API liga o Cosmos DB de verdade aqui — não é
  # o adaptador em memória. Por isso ela DEPENDE do emulador saudável, e
  # database e containers são criados na própria inicialização, antes de
  # `/saude/pronto` responder saudável.
  #
  #   docker compose --profile full up -d --build cosmos api frontend
  #
  # Front em http://localhost:5173, Data Explorer em http://localhost:1234.
  # Não é o modo de trabalho diário: em container você perde hot reload e
  # depurador (ADR-0013 §2).
  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: src/hosts/Jornada.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Persistencia__Provedor: cosmos
      # Chave PÚBLICA e fixa do emulador (documentada pela Microsoft); o emulador
      # vNext nem valida autenticação. Conta real usa identidade gerenciada.
      ConnectionStrings__Cosmos: AccountEndpoint=https://cosmos:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      Cosmos__Emulador: "true"
    depends_on:
      cosmos:
        condition: service_healthy
    ports:
      - "5080:8080"
    healthcheck:
      # A mesma pergunta que um orquestrador de pods faz antes de rotear
      # tráfego: liveness (`/saude`) não basta, porque não toca a dependência.
      # curl, não wget: a imagem aspnet (Debian slim) não tem wget.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/saude/pronto"]
      <<: *saude

  frontend:
    profiles: ["full"]
    build:
      # Contexto na raiz do repo (igual à API), não em ../frontend: a cartilha
      # (docs/CARTILHA.md) é build-time asset do frontend agora — fonte única,
      # sem cópia manual (ver frontend/Dockerfile e frontend/src/App.tsx).
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      <<: *saude

  #
  # workers:
  #   profiles: ["full"]
  #   build:
  #     context: ..
  #     dockerfile: src/hosts/Catalogo.Workers/Dockerfile
  #   depends_on:
  #     cosmos: { condition: service_healthy }

volumes:
  cosmosdados:
  azuritedados:
