name: CI

# A branch padrão do repositório é feat/estrutura-inicial (não existe main).
# Todo PR roda, qualquer que seja a base; push só na branch padrão.
on:
  push:
    branches: [feat/estrutura-inicial]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore Jornada.slnx

      # TreatWarningsAsErrors esta ligado em Directory.Build.props: um warning
      # aqui ja quebra o build. E deliberado - num dominio cheio de invariante,
      # aviso de referencia nula e bug esperando acontecer.
      - name: Compilar
        run: dotnet build Jornada.slnx --no-restore -c Release

      # As guardas do ADR-0001 rodam ANTES dos testes de dominio. Se a regra de
      # dependencia foi violada, o resto nao importa: o hexagono ja deixou de
      # existir e os testes verdes dariam falsa seguranca.
      - name: Guardas de arquitetura (ADR-0001)
        run: dotnet run --project tests/Jornada.Arquitetura.Testes -c Release --no-build

      - name: Testes de dominio
        run: dotnet run --project tests/Jornada.Dominio.Testes -c Release --no-build

  # O mesmo contrato para todo adaptador de persistencia: memoria e o emulador
  # do Cosmos DB (ADR-0016). Sem RLS, e esta suite (com a guarda de arquitetura)
  # que prova o isolamento entre empresas em toda consulta. E o que
  # garante que os testes de caso de uso, que rodam em memoria, valem para o
  # banco, e o que vai dizer se um adaptador novo substitui o atual.
  contrato-de-persistencia:
    runs-on: ubuntu-latest
    services:
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
        env:
          PROTOCOL: https
          ENABLE_TELEMETRY: 'false'
        ports: ['8081:8081']
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:8080/ready"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Contrato (memoria e Cosmos DB)
        env:
          # Chave publica e fixa do emulador; o emulador vNext nem valida autenticacao.
          JORNADA_TESTES_COSMOS: AccountEndpoint=https://localhost:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
          JORNADA_TESTES_COSMOS_EMULADOR: 'true'
        run: dotnet run --project tests/Jornada.Persistencia.Testes -c Release

  # O contrato OpenAPI commitado (contratos/v1/openapi.yaml) tem de bater com o
  # código, e passar nas regras do guia CAIXA (Spectral). Mudar rota, campo ou
  # código de resposta sem regenerar o arquivo quebra o build (ADR-0014).
  contrato-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Contrato em dia com o codigo
        run: ./scripts/gerar-contrato.sh --verificar

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regras do guia CAIXA (Spectral)
        run: npx --yes @stoplight/spectral-cli@6 lint contratos/v1/openapi.yaml --fail-severity error

  # O front tem os mesmos testes de esqueleto que o painel-ddd (menu, tema,
  # paleta por token, acessibilidade), e o build checa os tipos (tsc -b).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
