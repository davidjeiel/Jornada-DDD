      description: 'Roda o pré-check; se aprovado, abre uma nova revisão e as etapas de validação exigidas pela política. Reprovado no pré-check: 422 PRECHECK_REPROVADO.'
      operationId: submeterAtivo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: x-correlation-id
          in: header
          description: 'Identificador de rastreabilidade. Se ausente ou inválido, a API gera um e o devolve no cabeçalho de mesmo nome.'
          schema:
            type: string
            format: uuid
          example: 1cf88bdf-48c6-4421-a40b-79fb835a6c4d
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmeterAtivoRequest'
      responses:
        '201':
          description: Recurso criado.
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissaoResponse'
        '403':
          description: O papel da pessoa não permite esta ação neste ativo.
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Recurso não encontrado nesta empresa.
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflito com o estado atual do recurso.
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Regra de negócio não atendida.
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: 'Requisição inválida: corpo malformado, campo obrigatório ausente ou valor fora do domínio.'
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Empresa não identificada (token ou, em desenvolvimento, cabeçalho X-Empresa).'
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'Erro interno não esperado. O detalhe fica no log, sob o x-correlation-id.'
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - Bearer: [ ]
        - X-Empresa: [ ]
          X-Papel: [ ]
          X-Pessoa: [ ]
