openapi: 3.0.4
info:
  title: API Catálogo Corporativo DDD
  description: 'Catálogo governado de ativos de negócio (domínio, subdomínio, contexto, capacidade) e técnicos (sistema, aplicação, API, endpoint, dados), com ciclo de vida, pré-check, validação em etapas e score de qualidade cadastral.'
  contact:
    name: a definir com a governança
  version: 0.1.0
  x-equipe-responsavel: a definir com a governança
  x-gestor-negocial: a definir com a governança
  x-classificacao-informacao: a definir com a governança
  x-identificacao-rtc: a definir com a governança
  x-timeout-gateway: a definir com a governança
  x-timeout-backend: a definir com a governança
paths:
  /v1/perfil:
    get:
      tags:
        - Acesso
      summary: Quem é você para a API e o que pode fazer
      description: 'A pessoa do X-Pessoa, os papéis que valem agora (com escopo e blocos de tipos), os pleitos dela e o que ela pode fazer. Sem pessoa, identificado é false e tudo é consulta.'
      operationId: consultarPerfil
      parameters:
        - name: x-correlation-id
          in: header
          description: 'Identificador de rastreabilidade. Se ausente ou inválido, a API gera um e o devolve no cabeçalho de mesmo nome.'
          schema:
            type: string
            format: uuid
          example: 1cf88bdf-48c6-4421-a40b-79fb835a6c4d
      responses:
        '200':
          description: Operação concluída com sucesso.
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
        '400':
          description: 'Requisição inválida: corpo malformado, campo obrigatório ausente ou valor fora do domínio.'
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Empresa não identificada (token ou, em desenvolvimento, cabeçalho X-Empresa).'
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'Erro interno não esperado. O detalhe fica no log, sob o x-correlation-id.'
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - Bearer: [ ]
        - X-Empresa: [ ]
          X-Pessoa: [ ]
  /v1/pessoas:
    get:
      tags:
        - Acesso
      summary: Lista as pessoas ativas da empresa
      description: Por nome. É o "quem é você" do perfil enquanto não há identidade corporativa (ADR-0007).
