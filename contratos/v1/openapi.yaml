openapi: 3.0.4
info:
  title: API Catálogo Corporativo DDD
  description: 'Catálogo governado de ativos de negócio (domínio, subdomínio, contexto, capacidade) e técnicos (sistema, aplicação, API, endpoint, dados), com ciclo de vida, pré-check, validação em etapas e score de qualidade cadastral.'
  contact:
    name: a definir com a governança
  version: 0.1.0
  x-equipe-responsavel: a definir com a governança
  x-gestor-negocial: a definir com a governança
  x-classificacao-informacao: a definir com a governança
  x-identificacao-rtc: a definir com a governança
  x-timeout-gateway: a definir com a governança
  x-timeout-backend: a definir com a governança
paths:
  /v1/ativos:
    get:
      tags:
        - Catálogo
      summary: Lista os ativos da empresa
      description: 'Até 200 ativos, ordenados por código. O parâmetro tipo filtra pela chave do metamodelo (ex.: sistema).'
      operationId: listarAtivos
      parameters:
        - name: tipo
          in: query
          schema:
            type: string
        - name: x-correlation-id
          in: header
          description: 'Identificador de rastreabilidade. Se ausente ou inválido, a API gera um e o devolve no cabeçalho de mesmo nome.'
          schema:
            type: string
            format: uuid
          example: 1cf88bdf-48c6-4421-a40b-79fb835a6c4d
      responses:
        '200':
          description: Operação concluída com sucesso.
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeAtivosResponse'
        '400':
          description: 'Requisição inválida: corpo malformado, campo obrigatório ausente ou valor fora do domínio.'
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Empresa não identificada (token ou, em desenvolvimento, cabeçalho X-Empresa).'
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'Erro interno não esperado. O detalhe fica no log, sob o x-correlation-id.'
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - Bearer: [ ]
        - X-Empresa: [ ]
          X-Papel: [ ]
          X-Pessoa: [ ]
    post:
      tags:
        - Catálogo
      summary: Cadastra um ativo
      description: 'O ativo nasce em rascunho, com código gerado pelo tipo (ex.: SIS-0001). O papel precisa escrever no bloco do tipo: negócio cadastra a estrutura DDD, tech lead os ativos técnicos.'
      operationId: cadastrarAtivo
      parameters:
        - name: x-correlation-id
          in: header
          description: 'Identificador de rastreabilidade. Se ausente ou inválido, a API gera um e o devolve no cabeçalho de mesmo nome.'
          schema:
            type: string
            format: uuid
          example: 1cf88bdf-48c6-4421-a40b-79fb835a6c4d
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastrarAtivoRequest'
        required: true
      responses:
        '201':
          description: Recurso criado.
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtivoCriadoResponse'
        '403':
          description: O papel da pessoa não permite esta ação neste ativo.
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Regra de negócio não atendida.
          headers:
            x-correlation-id:
              description: O identificador de rastreabilidade desta requisição.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
