  /v1/pleitos:
    post:
      tags:
        - Acesso
      summary: Cadastra a pessoa e pede um papel
      description: 'Aberta a quem ainda não tem papel: não exige X-Pessoa. O cadastro não concede nada; a pessoa consulta o catálogo até um curador ou admin decidir. Matrícula já cadastrada atualiza o cadastro, sem duplicar; com pleito pendente, devolve 409 PLEITO_PENDENTE.'
