          type: array
          items:
            $ref: '#/components/schemas/ArestaResponse'
          description: As relações entre os nós devolvidos.
        truncado:
          type: boolean
          description: 'A expansão parou no teto: há mais ativos do que os mostrados.'
        teto:
          type: integer
          description: O máximo de nós.
          format: int32
      additionalProperties: false
      description: A vizinhança de um ativo no grafo de relações.
  securitySchemes:
    Bearer:
      type: http
      description: 'ALVO de produção: token JWT do provedor de identidade corporativo, com a empresa no claim tid_empresa. AINDA NÃO VALIDADO por esta versão da API — enquanto a identidade não for ligada, use os cabeçalhos de desenvolvimento.'
      scheme: bearer
      bearerFormat: JWT
    X-Empresa:
      type: apiKey
      description: SOMENTE DESENVOLVIMENTO. Id da empresa (UUID). Em produção vem do token.
      name: X-Empresa
      in: header
    X-Pessoa:
      type: apiKey
      description: 'SOMENTE DESENVOLVIMENTO. Id da pessoa cadastrada que age (UUID); os papéis são os concedidos a ela. Ausente ou desconhecida, a requisição só consulta.'
      name: X-Pessoa
      in: header
    X-Papel:
      type: apiKey
      description: 'SOMENTE MODO DEMONSTRAÇÃO (Acesso:ModoDemonstracao). admin, curador, arquiteto, techlead, negocio ou consulta; substitui os papéis concedidos. Fora desse modo é ignorado.'
      name: X-Papel
      in: header
    X-Modo:
      type: apiKey
      description: 'SOMENTE DESENVOLVIMENTO. leitura recusa toda escrita (MODO_LEITURA), mesmo para quem tem papel. Ausente vale edição.'
      name: X-Modo
      in: header
    X-Unidade:
      type: apiKey
      description: 'SOMENTE DESENVOLVIMENTO. Id da unidade da pessoa (UUID), escopo de autorização.'
      name: X-Unidade
      in: header
