components:
  schemas:
    AncestralResponse:
      required:
        - id
        - codigo
        - nome
        - tipoItem
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        nome:
          type: string
        tipoItem:
          type: string
      additionalProperties: false
      description: Um degrau da trilha hierárquica.
    AnexarEvidenciaRequest:
      required:
        - tipo
        - titulo
      type: object
      properties:
        tipo:
          type: string
          example: openapi
        titulo:
          type: string
          example: Contrato OpenAPI v2
        url:
          type: string
          nullable: true
          example: https://repositorio.exemplo/core-bancario/openapi.yaml
      additionalProperties: false
      description: 'Evidência que sustenta o cadastro (ADR, contrato, documento, link).'
    ApiError:
      required:
        - codigo
        - correlationId
        - dataHora
        - mensagem
      type: object
      properties:
        codigo:
          type: string
          description: 'Código estável, para o cliente tratar o erro sem interpretar texto.'
          example: ATIVO_NAO_ENCONTRADO
        mensagem:
          type: string
          description: Mensagem para pessoas. Nunca carrega stack trace nem dado interno.
          example: Ativo não encontrado.
        correlationId:
          type: string
          description: O mesmo valor devolvido no cabeçalho `x-correlation-id`.
          example: 7df2662f-1b66-43f5-98d4-bfe3c3600011
        dataHora:
          type: string
          description: 'Instante do erro, com fuso.'
          format: date-time
          example: '2026-10-09T10:37:00-03:00'
      additionalProperties: false
      description: Erro no padrão CAIXA. Toda resposta 4xx e 5xx desta API usa este formato.
    ArestaResponse:
      required:
        - origem
        - destino
        - tipo
        - criticidade
      type: object
      properties:
        origem:
          type: string
          description: Quem aponta.
          format: uuid
        destino:
          type: string
          description: Para quem aponta.
          format: uuid
        tipo:
          type: string
          description: 'implementa, expoe, consome, produz, depende_de ou persiste_em.'
        criticidade:
          type: string
          description: A criticidade da dependência.
        mecanismo:
          type: string
          description: 'Como a relação acontece, quando informado.'
          nullable: true
      additionalProperties: false
      description: 'Uma aresta da vizinhança, na direção real.'
    ArvoreResponse:
      required:
        - visao
        - raizes
      type: object
      properties:
        visao:
          type: string
          description: negocio (a partir do domínio) ou tecnica (a partir do sistema).
        raizes:
          type: array
          items:
            $ref: '#/components/schemas/NoDaArvoreResponse'
          description: 'Os nós de raiz, cada um com os descendentes.'
      additionalProperties: false
      description: Uma árvore do mapa.
    AtivoCriadoResponse:
      required:
        - id
      type: object
      properties:
        id:
          type: string
          description: Identificador público do ativo.
          format: uuid
      additionalProperties: false
      description: Ativo recém-cadastrado.
      example:
        id: 01a12128-8221-716c-89ac-50ca6aad15a3
    AtivoResumoResponse:
      required:
        - id
        - codigo
        - nome
        - tipo
        - status
        - criticidade
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        nome:
          type: string
        tipo:
          type: string
        status:
          type: string
        criticidade:
          type: string
      additionalProperties: false
      description: Linha da listagem do catálogo.
      example:
        id: 01a12128-8221-716c-89ac-50ca6aad15a3
        codigo: SIS-0001
        nome: Core Bancário
        tipo: sistema
        status: rascunho
        criticidade: alta
    AtribuirResponsavelRequest:
      required:
        - idPessoa
        - papel
      type: object
      properties:
        idPessoa:
          type: string
          format: uuid
          example: 44444444-4444-4444-4444-444444444444
        papel:
          type: string
          description: 'OwnerNegocial, OwnerTecnico, Arquiteto ou Mantenedor.'
          example: OwnerTecnico
      additionalProperties: false
      description: Define quem responde pelo ativo.
    AuditoriaResponse:
      required:
        - acao
        - pessoa
        - em
      type: object
      properties:
        acao:
          type: string
          description: 'criar, alterar, definir_responsavel, relacionar, anexar_evidencia, submeter, validar, publicar, abrir_revisao, descontinuar ou arquivar.'
        pessoa:
          type: string
          description: Quem agiu.
          format: uuid
        em:
          type: string
          description: Quando.
          format: date-time
        antes:
          type: object
          additionalProperties:
            type: string
          description: 'Valores anteriores, quando a ação altera algo.'
          nullable: true
        depois:
          type: object
          additionalProperties:
            type: string
          description: Valores novos ou detalhes da ação.
          nullable: true
      additionalProperties: false
      description: Uma linha da trilha de auditoria.
    BloqueioResponse:
      required:
        - codigo
        - mensagem
      type: object
      properties:
        codigo:
          type: string
          description: 'Chave estável (ex.: OWNER_NAO_DEFINIDO), para o cliente automatizar a correção.'
        mensagem:
          type: string
          description: Texto para pessoas.
