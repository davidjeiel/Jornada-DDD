components:
  schemas:
    AnexarEvidenciaRequest:
      required:
        - tipo
        - titulo
      type: object
      properties:
        tipo:
          type: string
          example: openapi
        titulo:
          type: string
          example: Contrato OpenAPI v2
        url:
          type: string
          nullable: true
          example: https://repositorio.exemplo/core-bancario/openapi.yaml
      additionalProperties: false
      description: 'Evidência que sustenta o cadastro (ADR, contrato, documento, link).'
    ApiError:
      required:
        - codigo
        - correlationId
        - dataHora
        - mensagem
      type: object
      properties:
        codigo:
          type: string
          description: 'Código estável, para o cliente tratar o erro sem interpretar texto.'
          example: ATIVO_NAO_ENCONTRADO
        mensagem:
          type: string
          description: Mensagem para pessoas. Nunca carrega stack trace nem dado interno.
          example: Ativo não encontrado.
        correlationId:
          type: string
          description: O mesmo valor devolvido no cabeçalho `x-correlation-id`.
          example: 7df2662f-1b66-43f5-98d4-bfe3c3600011
        dataHora:
          type: string
          description: 'Instante do erro, com fuso.'
          format: date-time
          example: '2026-10-09T10:37:00-03:00'
      additionalProperties: false
      description: Erro no padrão CAIXA. Toda resposta 4xx e 5xx desta API usa este formato.
    AtivoCriadoResponse:
      required:
        - id
      type: object
      properties:
        id:
          type: string
          description: Identificador público do ativo.
          format: uuid
      additionalProperties: false
      description: Ativo recém-cadastrado.
      example:
        id: 01a12128-8221-716c-89ac-50ca6aad15a3
    AtivoResumoResponse:
      required:
        - id
        - codigo
        - nome
        - tipo
        - status
        - criticidade
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        nome:
          type: string
        tipo:
          type: string
        status:
          type: string
        criticidade:
          type: string
      additionalProperties: false
      description: Linha da listagem do catálogo.
      example:
        id: 01a12128-8221-716c-89ac-50ca6aad15a3
        codigo: SIS-0001
        nome: Core Bancário
        tipo: sistema
        status: rascunho
        criticidade: alta
    AtribuirResponsavelRequest:
      required:
        - idPessoa
        - papel
      type: object
      properties:
        idPessoa:
          type: string
          format: uuid
          example: 44444444-4444-4444-4444-444444444444
        papel:
          type: string
          description: 'OwnerNegocial, OwnerTecnico, Arquiteto ou Mantenedor.'
          example: OwnerTecnico
      additionalProperties: false
      description: Define quem responde pelo ativo.
    BloqueioResponse:
      required:
        - codigo
        - mensagem
      type: object
      properties:
        codigo:
          type: string
          description: 'Chave estável (ex.: OWNER_NAO_DEFINIDO), para o cliente automatizar a correção.'
        mensagem:
          type: string
          description: Texto para pessoas.
      additionalProperties: false
      description: Impedimento de publicação.
    CadastrarAtivoRequest:
      required:
        - nome
        - tipo
      type: object
      properties:
        tipo:
          type: string
          description: 'Chave do tipo no metamodelo (dominio, subdominio, contexto, capacidade, sistema, aplicacao, repositorio, api, endpoint, base_dados, objeto_dado, evento).'
          example: sistema
        nome:
          type: string
          description: Nome do ativo. Único por tipo dentro da empresa.
          example: Core Bancário
        descricao:
          type: string
          description: 'Para que serve o ativo. Obrigatória para publicar, não para cadastrar.'
          nullable: true
          example: Sistema central de contas e lançamentos.
        criticidade:
          type: string
          description: 'baixa, media, alta ou critica. Ausente vale media.'
          nullable: true
          example: alta
        idPai:
          type: string
          description: 'Id do item pai, quando o tipo exige hierarquia (ex.: subdomínio exige domínio).'
          format: uuid
          nullable: true
        atributos:
          type: object
          additionalProperties:
            type: string
          description: 'Campos específicos do tipo, declarados no metamodelo.'
          nullable: true
          example:
            plataforma: mainframe
      additionalProperties: false
      description: Cadastro de um ativo novo. Ele nasce em rascunho.
    DecidirValidacaoRequest:
      required:
        - aprovada
      type: object
      properties:
        aprovada:
          type: boolean
          description: true aprova a etapa; false devolve o ativo ao rascunho.
          example: true
        motivo:
          type: string
          nullable: true
          example: Owner e evidência conferidos.
      additionalProperties: false
      description: Decisão sobre uma etapa de validação.
    DimensoesDoScoreResponse:
      required:
        - completude
        - consistencia
        - ownership
        - evidencia
        - temporalidade
      type: object
      properties:
        completude:
          type: integer
          format: int32
        consistencia:
          type: integer
          format: int32
        ownership:
          type: integer
          format: int32
        evidencia:
          type: integer
          format: int32
        temporalidade:
          type: integer
          format: int32
      additionalProperties: false
      description: 'As cinco dimensões do score de qualidade, de 0 a 100.'
    EditarAtivoRequest:
      required:
        - nome
      type: object
      properties:
        nome:
          type: string
          example: Core Bancário
        descricao:
          type: string
          nullable: true
          example: Sistema central de contas e lançamentos.
        criticidade:
          type: string
          nullable: true
          example: alta
        atributos:
          type: object
          additionalProperties:
            type: string
          description: Atributos informados são gravados; os ausentes ficam como estão.
          nullable: true
          example:
            plataforma: mainframe
      additionalProperties: false
      description: 'Estado completo dos campos editáveis (PUT substitui, não mescla).'
    EvidenciaResponse:
      required:
        - id
        - tipo
        - titulo
      type: object
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
        titulo:
          type: string
        url:
          type: string
          nullable: true
      additionalProperties: false
    FichaDoAtivoResponse:
      required:
        - id
        - codigo
        - nome
        - tipoItem
        - status
        - criticidade
        - descricao
        - revisaoAtual
        - trilha
        - atributos
        - evidencias
        - responsaveis
        - relacoes
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        nome:
          type: string
        tipoItem:
          type: string
        status:
          type: string
        criticidade:
          type: string
        descricao:
          type: string
        revisaoAtual:
          type: integer
          format: int32
        trilha:
          type: array
          items:
            type: string
        atributos:
          type: object
          additionalProperties:
            type: string
        evidencias:
          type: array
          items:
            $ref: '#/components/schemas/EvidenciaResponse'
        responsaveis:
          type: array
          items:
            $ref: '#/components/schemas/ResponsavelResponse'
        relacoes:
          type: array
          items:
            $ref: '#/components/schemas/RelacaoResponse'
      additionalProperties: false
      description: Ficha completa do ativo (visão 360°).
      example:
        id: 01a12128-8221-716c-89ac-50ca6aad15a3
        codigo: SIS-0001
        nome: Core Bancário
        tipoItem: sistema
        status: publicado
        criticidade: alta
        descricao: Sistema central de contas e lançamentos.
        revisaoAtual: 1
        trilha:
          - Core Bancário
        atributos:
          plataforma: mainframe
        evidencias:
          - id: 01a12128-8290-7d4e-a1f0-0b6a3c2d9e10
            tipo: openapi
            titulo: Contrato OpenAPI v2
            url: https://repositorio.exemplo/core-bancario/openapi.yaml
        responsaveis:
          - idPessoa: 40000000-0000-0000-0000-000000000009
            papel: OwnerTecnico
            inicioVigencia: '2026-10-09'
            fimVigencia: null
            vigente: true
        relacoes: [ ]
    ListaDeAtivosResponse:
      required:
        - total
        - ativos
      type: object
      properties:
        total:
          type: integer
          format: int32
        ativos:
          type: array
          items:
            $ref: '#/components/schemas/AtivoResumoResponse'
      additionalProperties: false
      description: Listagem do catálogo da empresa.
    ListaDeValidacoesResponse:
      required:
        - total
        - validacoes
      type: object
      properties:
        total:
          type: integer
          format: int32
        validacoes:
          type: array
          items:
            $ref: '#/components/schemas/ValidacaoResponse'
      additionalProperties: false
      description: Fila de validações da empresa.
    PassoResponse:
      required:
        - passo
        - rotulo
        - concluido
        - impedimentos
      type: object
      properties:
        passo:
          type: string
        rotulo:
          type: string
        concluido:
          type: boolean
        impedimentos:
          type: array
          items:
            type: string
      additionalProperties: false
      description: Passo do caminho até a publicação.
    PoliticaResponse:
      required:
        - scoreMinimo
        - evidenciaMinima
        - slaHoras
        - etapas
      type: object
      properties:
        scoreMinimo:
          type: integer
          format: int32
        evidenciaMinima:
          type: integer
          format: int32
        slaHoras:
          type: integer
          format: int32
        etapas:
          type: array
          items:
            type: string
      additionalProperties: false
      description: Política de governança que vale para este ativo (tipo × criticidade).
    PreCheckResponse:
      required:
        - aprovado
        - score
        - dimensoes
        - bloqueios
        - alertas
        - politica
        - caminho
      type: object
      properties:
        aprovado:
          type: boolean
        score:
          type: integer
          format: int32
        dimensoes:
          $ref: '#/components/schemas/DimensoesDoScoreResponse'
        bloqueios:
          type: array
          items:
            $ref: '#/components/schemas/BloqueioResponse'
        alertas:
          type: array
          items:
            type: string
        politica:
          $ref: '#/components/schemas/PoliticaResponse'
        caminho:
          type: array
          items:
            $ref: '#/components/schemas/PassoResponse'
      additionalProperties: false
      description: 'Resultado do pré-check: o que falta para o ativo poder ser submetido.'
      example:
        aprovado: false
        score: 76
        dimensoes:
          completude: 100
          consistencia: 100
          ownership: 0
          evidencia: 80
          temporalidade: 100
        bloqueios:
          - codigo: OWNER_NAO_DEFINIDO
            mensagem: Owner técnico não definido
        alertas:
          - Definir owner tecnico
        politica:
          scoreMinimo: 60
          evidenciaMinima: 0
          slaHoras: 72
          etapas:
            - tecnica
        caminho:
          - passo: responsaveis
            rotulo: Definir responsáveis
            concluido: false
            impedimentos:
              - OWNER_NAO_DEFINIDO
    RelacaoResponse:
      required:
        - direcao
        - ativoId
        - codigo
        - nome
        - tipo
      type: object
      properties:
        direcao:
          type: string
          description: saida (este ativo é a origem) ou entrada (é o destino).
        ativoId:
          type: string
          description: O ativo do outro lado.
          format: uuid
        codigo:
          type: string
          description: Código do ativo do outro lado.
        nome:
          type: string
          description: Nome do ativo do outro lado.
        tipo:
          type: string
          description: Tipo da relação.
      additionalProperties: false
      description: Relação vista a partir deste ativo.
    RelacionarAtivosRequest:
      required:
        - idDestino
        - tipo
      type: object
      properties:
        idDestino:
          type: string
          format: uuid
        tipo:
          type: string
          description: 'implementa, expoe, consome, produz, depende_de ou persiste_em.'
          example: depende_de
      additionalProperties: false
      description: Relação deste ativo (origem) com outro (destino).
    ResponsavelResponse:
      required:
        - idPessoa
        - papel
        - inicioVigencia
        - vigente
      type: object
      properties:
        idPessoa:
          type: string
          format: uuid
        papel:
          type: string
        inicioVigencia:
          type: string
          format: date
        fimVigencia:
          type: string
          format: date
          nullable: true
        vigente:
          type: boolean
      additionalProperties: false
    SaudeResponse:
      required:
        - situacao
      type: object
      properties:
        situacao:
          type: string
      additionalProperties: false
      description: Resposta da verificação de vida do processo.
      example:
        situacao: ok
    SubmeterAtivoRequest:
      type: object
      properties:
        motivo:
          type: string
          nullable: true
          example: Primeira versão
      additionalProperties: false
      description: Envio do ativo para validação.
    SubmissaoResponse:
      required:
        - revisao
        - score
        - etapasAbertas
      type: object
      properties:
        revisao:
          type: integer
          format: int32
        score:
          type: integer
          format: int32
        etapasAbertas:
          type: array
          items:
            type: string
      additionalProperties: false
      description: 'Submissão aceita: a revisão foi aberta e as etapas exigidas pela política aguardam decisão.'
      example:
        revisao: 1
        score: 97
        etapasAbertas:
          - tecnica
    ValidacaoResponse:
      required:
        - id
        - ativo
        - revisao
        - etapa
        - status
        - submetidaPor
      type: object
      properties:
        id:
          type: string
          description: Identificador da validação.
          format: uuid
        ativo:
          type: string
          description: Ativo validado.
          format: uuid
        revisao:
          type: integer
          description: Número da revisão submetida.
          format: int32
        etapa:
          type: string
          description: 'negocial, tecnica ou arquitetural.'
        status:
          type: string
          description: 'aberta, aprovada ou reprovada.'
        submetidaPor:
          type: string
          description: Quem submeteu a revisão.
          format: uuid
        decididaPor:
          type: string
          description: 'Quem decidiu a etapa, se já decidida.'
          format: uuid
          nullable: true
        motivo:
          type: string
          description: Justificativa da decisão.
          nullable: true
      additionalProperties: false
      description: Etapa de validação de uma revisão.
      example:
        id: 01a12128-8277-7ab1-9c35-1b2e4f9d0c11
        ativo: 01a12128-8221-716c-89ac-50ca6aad15a3
        revisao: 1
        etapa: tecnica
        status: aberta
        submetidaPor: 20000000-0000-0000-0000-000000000001
        decididaPor: null
        motivo: null
  securitySchemes:
    Bearer:
      type: http
      description: 'ALVO de produção: token JWT do provedor de identidade corporativo, com a empresa no claim tid_empresa. AINDA NÃO VALIDADO por esta versão da API — enquanto a identidade não for ligada, use os cabeçalhos de desenvolvimento.'
      scheme: bearer
      bearerFormat: JWT
    X-Empresa:
      type: apiKey
      description: SOMENTE DESENVOLVIMENTO. Id da empresa (UUID). Em produção vem do token.
      name: X-Empresa
      in: header
    X-Papel:
      type: apiKey
      description: 'SOMENTE DESENVOLVIMENTO. admin, curador, arquiteto, techlead, negocio ou consulta.'
      name: X-Papel
      in: header
    X-Pessoa:
      type: apiKey
      description: SOMENTE DESENVOLVIMENTO. Id da pessoa que age (UUID).
      name: X-Pessoa
      in: header
    X-Unidade:
      type: apiKey
      description: 'SOMENTE DESENVOLVIMENTO. Id da unidade da pessoa (UUID), escopo de autorização.'
      name: X-Unidade
      in: header
tags:
  - name: Catálogo
    description: 'Cadastro e consulta de ativos, responsáveis, evidências e relações.'
  - name: Governança
    description: 'Pré-check, submissão e decisão das etapas de validação.'
  - name: Operação
    description: Verificações de saúde para o orquestrador.